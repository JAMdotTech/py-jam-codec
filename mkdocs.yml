site_name: Python JAM-codec Docs
repo_url: https://github.com/JAMdotTech/py-jam-codec
edit_uri: edit/main/docs/
site_description: Python implementation of the JAM codec as specified in the graypaper.

theme:
  name: "material"
  logo: https://avatars.githubusercontent.com/u/43450475
  features:
    # - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.prune
#    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
#    - toc.integrate

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
#            docstring_section_style: list
            members_order: source
            show_root_heading: false
            show_source: false
            show_signature_annotations: true
            docstring_style: numpy
            heading_level: 2

  - autorefs
  - search

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/JAMdotTech
  - icon: fontawesome/brands/twitter
    link: https://x.com/JAMdotTech

nav:
  - Overview: index.md
  - Function Reference:
      - Base: reference/base.md
      - Types: reference/types.md

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

